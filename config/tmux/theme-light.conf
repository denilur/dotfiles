# ── IlyasYOY Monochrome (light) — tmux colours, synced with nvim/Ghostty ─────
# bg         #eeeeee  terminal background
# surface    #dadada  status bar
# chip       #c6c6c6  inactive tab / date
# primary    #ffaf00  amber accent (active tab, session, active border)
# on-primary #000000
# muted      #626262  inactive text, borders
# fg         #000000
# cursor     #8787af  time chip
# alert      #ff005f  bell

set -g pane-border-style "fg=#a8a8a8"
set -g pane-active-border-style "fg=#ffaf00"

set -g status-style "bg=#dadada,fg=#000000"

# Session chip
set -g status-left "#[fg=#000000,bg=#ffaf00,bold] 󰘗 #{session_name} #[bg=#dadada] "

# Date & time chips
set -g status-right "#[fg=#000000,bg=#c6c6c6] 󰃭 %d.%m.%Y #[fg=#eeeeee,bg=#8787af,bold] 󰥔 %H:%M #[bg=#dadada] "

setw -g window-status-style "bg=#dadada,fg=#626262"

# Inactive tab
setw -g window-status-format " #[fg=#626262,bg=#c6c6c6] #I #[fg=#000000,bg=#c6c6c6]#W#{?window_zoomed_flag, 󰁌,} "

# Active tab
setw -g window-status-current-style "bg=#dadada,fg=#000000,bold"
setw -g window-status-current-format " #[fg=#000000,bg=#ffaf00,bold] #I #W#{?window_zoomed_flag, 󰁌,} "

setw -g window-status-activity-style "bg=#c6c6c6,fg=#000000,bold"
setw -g window-status-bell-style "bg=#ff005f,fg=#000000,bold"

set -g message-style "bg=#c6c6c6,fg=#000000"
set -g mode-style "bg=#ffaf00,fg=#000000"
