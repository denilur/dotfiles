# ── IlyasYOY Monochrome (dark) — tmux colours, synced with nvim/Ghostty ──────
# bg         #000000  terminal background
# surface    #191919  status bar
# chip       #303030  inactive tab / date
# primary    #ffaf00  amber accent (active tab, session, active border)
# on-primary #191919
# muted      #707070  inactive text, borders
# fg         #dadada
# cursor     #8787af  time chip
# alert      #ff005f  bell

set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#ffaf00"

set -g status-style "bg=#191919,fg=#dadada"

# Session chip
set -g status-left "#[fg=#191919,bg=#ffaf00,bold] 󰘗 #{session_name} #[bg=#191919] "

# Date & time chips
set -g status-right "#[fg=#dadada,bg=#303030] 󰃭 %d.%m.%Y #[fg=#000000,bg=#8787af,bold] 󰥔 %H:%M #[bg=#191919] "

setw -g window-status-style "bg=#191919,fg=#707070"

# Inactive tab
setw -g window-status-format " #[fg=#707070,bg=#303030] #I #[fg=#dadada,bg=#303030]#W#{?window_zoomed_flag, 󰁌,} "

# Active tab
setw -g window-status-current-style "bg=#191919,fg=#191919,bold"
setw -g window-status-current-format " #[fg=#191919,bg=#ffaf00,bold] #I #W#{?window_zoomed_flag, 󰁌,} "

setw -g window-status-activity-style "bg=#303030,fg=#dadada,bold"
setw -g window-status-bell-style "bg=#ff005f,fg=#000000,bold"

set -g message-style "bg=#303030,fg=#dadada"
set -g mode-style "bg=#ffaf00,fg=#000000"
