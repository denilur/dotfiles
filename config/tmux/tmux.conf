# ─────────────────────────────────────────────────────────────────────────────
# tmux — IlyasYOY Monochrome, synced with nvim ilyasyoy-mono and Ghostty
# Font: JetBrainsMono Nerd Font
# ─────────────────────────────────────────────────────────────────────────────

# ── Prefix & reload ───────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display-message " config reloaded "

# ── Terminal ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:hyperlinks"
set -as terminal-features ",*:extkeys"
set -s extended-keys on
set -as terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10
set -g focus-events on

# ── Indexing ──────────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Mouse & history ───────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 100000

# ── Vi keys ───────────────────────────────────────────────────────────────────
setw -g mode-keys vi
set -g status-keys vi

# ── Panes (move: C-h/j/k/l via vim-tmux-navigator, resize: prefix H/J/K/L) ─────────────────────────────────────────────────────────────────────
set -g pane-border-lines single

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

bind z resize-pane -Z
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #W? (y/n)" kill-window
bind \\ display-popup -d "#{pane_current_path}" -E

# ── Windows ───────────────────────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind Tab last-window

# ── Claude Code in a right split ─────────────────────────────────────────────
bind a split-window -h -c "#{pane_current_path}" "zsh -ilc 'exec claude --continue'"
bind A split-window -h -c "#{pane_current_path}" "zsh -ilc 'exec claude'"

# ── Copy mode ─────────────────────────────────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind / copy-mode \; command-prompt -p "search:" "send -X search-forward '%%%'"
bind ? copy-mode \; command-prompt -p "search up:" "send -X search-backward '%%%'"

# ── Status bar (top) ──────────────────────────────────────────────────────────
set -g status-position top
set -g status-justify centre
set -g status-interval 5

set -g status-left-length 28
set -g status-right-length 48

setw -g window-status-separator ""

# ── Theme (follows macOS Appearance, synced with Neovim/Ghostty) ─────────────
# Dark:  IlyasYOY Monochrome Dark   theme-dark.conf
# Light: IlyasYOY Monochrome Light  theme-light.conf
if-shell '[ "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" = "Dark" ]' \
  'source-file ~/.config/tmux/theme-dark.conf' \
  'source-file ~/.config/tmux/theme-light.conf'

# Poll Appearance and re-source the matching theme file on change.
run-shell -b "~/.config/tmux/theme-watch.sh"

# ── TPM plugins ───────────────────────────────────────────────────────────────
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

set -g @continuum-restore "on"
set -g @continuum-save-interval "15"

run-shell "~/.config/tmux/plugins/tpm/tpm"
