# ── Kanagawa Wave (dark) — tmux colours ─────────────────────────────────────
# bg         #1f1f28  sumi ink
# surface    #2a2a37  status bar
# chip       #363646  inactive tab
# primary    #7e9cd8  blue accent
# on-primary #1f1f28
# muted      #727169  inactive text
# accent     #c8c093  activity / highlights
# panel      #223249  date/time chip

set -g pane-border-style "fg=#54546d"
set -g pane-active-border-style "fg=#7e9cd8"

set -g status-style "bg=#2a2a37,fg=#dcd7ba"

# Session chip
set -g status-left "#[fg=#1f1f28,bg=#7e9cd8,bold] 󰘗 #[fg=#1f1f28,bg=#7e9cd8,bold]#{session_name}#[fg=#7e9cd8,bg=#2a2a37] "

# Date & time chips
set -g status-right "#[fg=#7e9cd8,bg=#2a2a37] #[fg=#dcd7ba,bg=#223249] 󰃭 %d.%m.%Y #[fg=#1f1f28,bg=#c8c093,bold] 󰥔 %H:%M #[fg=#c8c093,bg=#2a2a37] "

setw -g window-status-style "bg=#2a2a37,fg=#727169"

# Inactive tab — surface chip
setw -g window-status-format " #[fg=#727169,bg=#363646] #I #[fg=#c8c093,bg=#363646] #W#{?window_zoomed_flag, 󰁌,} "

# Active tab — primary filled chip
setw -g window-status-current-style "bg=#2a2a37,fg=#1f1f28,bold"
setw -g window-status-current-format " #[fg=#1f1f28,bg=#7e9cd8,bold] #I #[fg=#1f1f28,bg=#7e9cd8,bold] #W#{?window_zoomed_flag, 󰁌,} "

# Activity indicator — Kanagawa warning tone
setw -g window-status-activity-style "bg=#2a2a37,fg=#e6c384,bold"
