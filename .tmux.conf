# ─────────────────────────────────────────────────────────────────────────────
# tmux — Kanagawa Wave dark
# Font: JetBrainsMono Nerd Font
# ─────────────────────────────────────────────────────────────────────────────

# ── Prefix & reload ───────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display-message " config reloaded "

# ── Terminal ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10
set -g focus-events on
set -g aggressive-resize off

# ── Indexing ──────────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Mouse & history ───────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 100000

# ── Vi keys ───────────────────────────────────────────────────────────────────
setw -g mode-keys vi
set -g status-keys vi

# ── Panes ─────────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#54546d"
set -g pane-active-border-style "fg=#7e9cd8"
set -g pane-border-lines single

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

bind z resize-pane -Z
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #W? (y/n)" kill-window
bind \\ display-popup -d "#{pane_current_path}" -E

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 3
bind -n M-S-Down  resize-pane -D 3

# ── Windows ───────────────────────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind Tab last-window

# ── Copy mode ─────────────────────────────────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind / copy-mode \; command-prompt -p "search:" "send -X search-forward '%%%'"
bind ? copy-mode \; command-prompt -p "search up:" "send -X search-backward '%%%'"

# ── Kanagawa Wave palette ────────────────────────────────────────────────────
# bg         #1f1f28  sumi ink
# surface    #2a2a37  status bar
# chip       #363646  inactive tab
# primary    #7e9cd8  blue accent
# on-primary #1f1f28
# muted      #727169  inactive text
# accent     #c8c093  activity / highlights
# panel      #223249  date/time chip

# ── Status bar (top) ──────────────────────────────────────────────────────────
set -g status-position top
set -g status-style "bg=#2a2a37,fg=#dcd7ba"
set -g status-justify centre
set -g status-interval 5

set -g status-left-length 28
set -g status-right-length 48

# Session chip
set -g status-left "#[fg=#1f1f28,bg=#7e9cd8,bold] 󰘗 #[fg=#1f1f28,bg=#7e9cd8,bold]#{session_name}#[fg=#7e9cd8,bg=#2a2a37] "

# Date & time chips
set -g status-right "#[fg=#7e9cd8,bg=#2a2a37] #[fg=#dcd7ba,bg=#223249] 󰃭 %d.%m.%Y #[fg=#1f1f28,bg=#c8c093,bold] 󰥔 %H:%M #[fg=#c8c093,bg=#2a2a37] "

# ── Tabs (Kanagawa chips) ─────────────────────────────────────────────────────
setw -g window-status-separator ""
setw -g window-status-style "bg=#2a2a37,fg=#727169"

# Inactive tab — surface chip
setw -g window-status-format " #[fg=#727169,bg=#363646] #I #[fg=#c8c093,bg=#363646] #W#{?window_zoomed_flag, 󰁌,} "

# Active tab — primary filled chip
setw -g window-status-current-style "bg=#2a2a37,fg=#1f1f28,bold"
setw -g window-status-current-format " #[fg=#1f1f28,bg=#7e9cd8,bold] #I #[fg=#1f1f28,bg=#7e9cd8,bold] #W#{?window_zoomed_flag, 󰁌,} "

# Activity indicator — Kanagawa warning tone
setw -g window-status-activity-style "bg=#2a2a37,fg=#e6c384,bold"

# ── TPM plugins ───────────────────────────────────────────────────────────────
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

set -g @continuum-restore "on"
set -g @continuum-save-interval "15"

run-shell "~/.config/tmux/plugins/tpm/tpm"
