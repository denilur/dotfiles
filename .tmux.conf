# ─────────────────────────────────────────────────────────────────────────────
# tmux — Material Design 3 dark
# Font: JetBrainsMono Nerd Font
# ─────────────────────────────────────────────────────────────────────────────

# ── Prefix & reload ───────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display-message " config reloaded "

# ── Terminal ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",xterm-256color:RGB"
set -s escape-time 0
set -g focus-events on
set -g aggressive-resize on

# ── Indexing ──────────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Mouse & history ───────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000

# ── Vi keys ───────────────────────────────────────────────────────────────────
setw -g mode-keys vi
set -g status-keys vi

# ── Panes ─────────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#49454f"
set -g pane-active-border-style "fg=#90caf9"
set -g pane-border-lines single

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

bind z resize-pane -Z
bind \\ display-popup -d "#{pane_current_path}" -E

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 3
bind -n M-S-Down  resize-pane -D 3

# ── Windows ───────────────────────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind Tab last-window

# ── Copy mode ─────────────────────────────────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind / copy-mode \; command-prompt -p "search:" "send -X search-forward '%%%'"
bind ? copy-mode \; command-prompt -p "search up:" "send -X search-backward '%%%'"

# ── Material palette ──────────────────────────────────────────────────────────
# bg        #121212  surface
# surface   #1e1e1e  status bar
# chip      #2d2d2d  inactive tab
# primary   #1976d2  active tab
# on-primary #ffffff
# muted     #9e9e9e  inactive text
# accent    #90caf9  borders / activity
# panel     #263238  date/time chip

# ── Status bar (top) ──────────────────────────────────────────────────────────
set -g status-position top
set -g status-style "bg=#1e1e1e,fg=#e3e2e6"
set -g status-justify centre
set -g status-interval 5

set -g status-left-length 28
set -g status-right-length 48

# Session chip
set -g status-left "#[fg=#e3f2fd,bg=#1565c0,bold] 󰘗 #[fg=#ffffff,bg=#1565c0,bold]#{session_name}#[fg=#1565c0,bg=#1e1e1e] "

# Date & time chips
set -g status-right "#[fg=#1565c0,bg=#1e1e1e] #[fg=#ffffff,bg=#263238] 󰃭 %d.%m.%Y #[fg=#ffffff,bg=#37474f,bold] 󰥔 %H:%M #[fg=#37474f,bg=#1e1e1e] "

# ── Tabs (Material chips) ─────────────────────────────────────────────────────
setw -g window-status-separator ""
setw -g window-status-style "bg=#1e1e1e,fg=#9e9e9e"

# Inactive tab — surface chip
setw -g window-status-format " #[fg=#757575,bg=#2d2d2d] #I #[fg=#bdbdbd,bg=#2d2d2d] #W#{?window_zoomed_flag, 󰁌,} "

# Active tab — primary filled chip
setw -g window-status-current-style "bg=#1e1e1e,fg=#ffffff,bold"
setw -g window-status-current-format " #[fg=#bbdefb,bg=#1976d2,bold] #I #[fg=#ffffff,bg=#1976d2,bold] #W#{?window_zoomed_flag, 󰁌,} "

# Activity indicator — Material warning tone
setw -g window-status-activity-style "bg=#1e1e1e,fg=#ffb74d,bold"

# ── TPM plugins ───────────────────────────────────────────────────────────────
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

set -g @continuum-restore "on"
set -g @continuum-save-interval "15"

run-shell "~/.config/tmux/plugins/tpm/tpm"
