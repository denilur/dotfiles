name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        env:
          NVIM_VERSION: v0.12.2
          STYLUA_VERSION: v2.1.0
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck luarocks unzip
          sudo luarocks install luacheck
          curl -fsSL -o stylua.zip "https://github.com/JohnnyMorganz/StyLua/releases/download/${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          unzip -q stylua.zip -d stylua-bin && sudo install stylua-bin/stylua /usr/local/bin/stylua
          curl -fsSL -o nvim.tar.gz "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          tar xzf nvim.tar.gz && echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: make check-lua check-shell

      - name: Neovim startup
        run: |
          mkdir -p ~/.config && ln -s "$PWD/config/nvim" ~/.config/nvim
          make check-nvim
