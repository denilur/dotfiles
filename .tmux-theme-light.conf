# ── Catppuccin Latte (light) — tmux colours ─────────────────────────────────
# bg         #eff1f5  base
# surface    #e6e9ef  status bar (mantle)
# chip       #ccd0da  inactive tab (surface0)
# primary    #1e66f5  blue accent
# on-primary #eff1f5
# muted      #9ca0b0  inactive text (overlay0)
# accent     #df8e1d  activity / time chip (yellow)
# panel      #ccd0da  date chip (surface0)

set -g pane-border-style "fg=#acb0be"
set -g pane-active-border-style "fg=#1e66f5"

set -g status-style "bg=#e6e9ef,fg=#4c4f69"

# Session chip
set -g status-left "#[fg=#eff1f5,bg=#1e66f5,bold] 󰘗 #[fg=#eff1f5,bg=#1e66f5,bold]#{session_name}#[fg=#1e66f5,bg=#e6e9ef] "

# Date & time chips
set -g status-right "#[fg=#1e66f5,bg=#e6e9ef] #[fg=#4c4f69,bg=#ccd0da] 󰃭 %d.%m.%Y #[fg=#eff1f5,bg=#df8e1d,bold] 󰥔 %H:%M #[fg=#df8e1d,bg=#e6e9ef] "

setw -g window-status-style "bg=#e6e9ef,fg=#9ca0b0"

# Inactive tab — surface chip
setw -g window-status-format " #[fg=#9ca0b0,bg=#ccd0da] #I #[fg=#fe640b,bg=#ccd0da] #W#{?window_zoomed_flag, 󰁌,} "

# Active tab — primary filled chip
setw -g window-status-current-style "bg=#e6e9ef,fg=#eff1f5,bold"
setw -g window-status-current-format " #[fg=#eff1f5,bg=#1e66f5,bold] #I #[fg=#eff1f5,bg=#1e66f5,bold] #W#{?window_zoomed_flag, 󰁌,} "

# Activity indicator — Catppuccin yellow
setw -g window-status-activity-style "bg=#e6e9ef,fg=#df8e1d,bold"
