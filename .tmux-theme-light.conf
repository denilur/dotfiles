# ── Solarized Light (light) — tmux colours ──────────────────────────────────
# bg         #fdf6e3  base3 (paper)
# surface    #f5efdc  base3/base2 blend (status bar)
# chip       #eee8d5  base2 (inactive tab)
# primary    #268bd2  blue
# on-primary #fdf6e3
# muted      #93a1a1  base1 (inactive text)
# accent     #b58900  yellow (activity / highlights)
# panel      #eee8d5  base2 (date/time chip)

set -g pane-border-style "fg=#93a1a1"
set -g pane-active-border-style "fg=#268bd2"

set -g status-style "bg=#f5efdc,fg=#657b83"

# Session chip
set -g status-left "#[fg=#fdf6e3,bg=#268bd2,bold] 󰘗 #[fg=#fdf6e3,bg=#268bd2,bold]#{session_name}#[fg=#268bd2,bg=#f5efdc] "

# Date & time chips
set -g status-right "#[fg=#268bd2,bg=#f5efdc] #[fg=#657b83,bg=#eee8d5] 󰃭 %d.%m.%Y #[fg=#fdf6e3,bg=#b58900,bold] 󰥔 %H:%M #[fg=#b58900,bg=#f5efdc] "

setw -g window-status-style "bg=#f5efdc,fg=#93a1a1"

# Inactive tab — surface chip
setw -g window-status-format " #[fg=#93a1a1,bg=#eee8d5] #I #[fg=#b58900,bg=#eee8d5] #W#{?window_zoomed_flag, 󰁌,} "

# Active tab — primary filled chip
setw -g window-status-current-style "bg=#f5efdc,fg=#fdf6e3,bold"
setw -g window-status-current-format " #[fg=#fdf6e3,bg=#268bd2,bold] #I #[fg=#fdf6e3,bg=#268bd2,bold] #W#{?window_zoomed_flag, 󰁌,} "

# Activity indicator — Solarized warning tone
setw -g window-status-activity-style "bg=#f5efdc,fg=#dc322f,bold"
